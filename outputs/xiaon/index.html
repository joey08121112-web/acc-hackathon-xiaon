<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"/><meta name="theme-color" content="#f8f7ef"/><meta name="description" content="学伴小N · 按自己的节奏，一起发现数学里的小进步。本地交互演示。"/><title>学伴小N · 慢慢来，也会到达</title></head><body><div id="root"><div id="xn-fallback" style="min-height:100vh;background:#f8f7ef;color:#2d4034;font:15px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;"><div style="max-width:560px;background:#fff;border:1px solid #e2e5d8;border-radius:16px;padding:28px 26px;"><div style="font-size:17px;font-weight:600;margin-bottom:10px;">学伴小N 还没有运行起来</div><p style="margin:0 0 12px;">你能看到这条消息，说明当前环境没有执行页面脚本。常见于：微信/网盘/压缩软件的预览窗口里直接打开，或浏览器内核过旧（如 IE、360 浏览器兼容模式）。</p><p style="margin:0 0 8px;font-weight:600;">请这样打开：</p><ol style="margin:0 0 12px;padding-left:22px;"><li>先把体验包 zip 解压到电脑本地（不要在压缩软件里直接双击）；</li><li>用 Chrome 或 Edge 打开「双击打开-学伴小N.html」；</li><li>手机预览窗口无法体验，请换电脑浏览器。</li></ol><p style="margin:0;color:#6d7869;font-size:13px;">仍然打不开？把这一屏截图发给提供者，并注明设备与浏览器。</p><div id="xn-boot-error" style="display:none;margin-top:12px;padding:10px 12px;background:#fdecea;border-radius:8px;font-size:12px;color:#8a2821;word-break:break-all;"></div></div></div></div><script>window.onerror = function (m) { try { var box = document.getElementById('xn-boot-error'); var fb = document.getElementById('xn-fallback'); if (box && fb) { box.style.display = 'block'; box.textContent = '页面脚本错误信息：' + m; } } catch (e) {} return false; };</script><script type="module" src="/src/main.tsx"></script></body></html>
